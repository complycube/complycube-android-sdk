name: Compatibility Matrix Build

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk: "17"
            gradle: "8.9"
            agp: "8.7.2"
            kotlin: "1.9.25"
            compileSdk: 34
            targetSdk: 34

          - jdk: "17"
            gradle: "8.9"
            agp: "8.6.1"
            kotlin: "1.9.25"
            compileSdk: 34
            targetSdk: 34

          - jdk: "17"
            gradle: "8.10.2"
            agp: "8.8.0"
            kotlin: "1.9.25"
            compileSdk: 34
            targetSdk: 34

          - jdk: "17"
            gradle: "8.9"
            agp: "8.7.2"
            kotlin: "1.9.24"
            compileSdk: 34
            targetSdk: 34

          - jdk: "17"
            gradle: "8.9"
            agp: "8.7.2"
            kotlin: "2.0.0"
            compileSdk: 34
            targetSdk: 34

          - jdk: "17"
            gradle: "8.9"
            agp: "8.7.2"
            kotlin: "1.9.25"
            compileSdk: 33
            targetSdk: 33

          - jdk: "17"
            gradle: "8.9"
            agp: "8.7.2"
            kotlin: "1.9.25"
            compileSdk: 35
            targetSdk: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Resolve release SDK version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version such as 1.7.2"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pin Gradle wrapper distribution
        shell: bash
        run: |
          set -e
          FILE="gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$FILE" ]; then
            echo "Missing $FILE"
            exit 1
          fi
          sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip|g" "$FILE"
          cat "$FILE"

      - name: Assemble Debug
        id: assemble
        shell: bash
        run: |
          ./gradlew --version
          ./gradlew :app:assembleDebug \
            -PAGP_VERSION=${{ matrix.agp }} \
            -PKOTLIN_VERSION=${{ matrix.kotlin }} \
            -PCOMPLYCUBE_COMPILE_SDK=${{ matrix.compileSdk }} \
            -PCOMPLYCUBE_TARGET_SDK=${{ matrix.targetSdk }} \
            -PCOMPLYCUBE_SDK_VERSION=${{ steps.release.outputs.version }} \
            --no-daemon

      - name: Write build result JSON
        if: always()
        shell: bash
        run: |
          python3 scripts/compat/write_result.py \
            --out "compat-results/result.json" \
            --sdk "${{ steps.release.outputs.version }}" \
            --jdk "${{ matrix.jdk }}" \
            --gradle "${{ matrix.gradle }}" \
            --agp "${{ matrix.agp }}" \
            --kotlin "${{ matrix.kotlin }}" \
            --compileSdk "${{ matrix.compileSdk }}" \
            --targetSdk "${{ matrix.targetSdk }}" \
            --status "${{ steps.assemble.outcome }}"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-result-${{ steps.release.outputs.version }}-${{ matrix.jdk }}-${{ matrix.gradle }}-${{ matrix.agp }}-${{ matrix.kotlin }}-${{ matrix.compileSdk }}-${{ matrix.targetSdk }}
          path: compat-results/result.json

  aggregate:
    needs: build-matrix
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/compat-results

      - name: Generate compatibility-matrix.md
        shell: bash
        run: |
          python3 scripts/compat/generate_matrix.py \
            --results-dir "${{ runner.temp }}/compat-results" \
            --out compatibility-matrix.md

      - name: Create PR if matrix changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update compatibility matrix"
          title: "chore: update compatibility matrix for SDK ${{ github.ref_name }}"
          body: "Automated update of compatibility-matrix.md for ComplyCube SDK ${{ github.ref_name }}."
          branch: "chore/update-compatibility-matrix"
          base: "main"
          add-paths: "compatibility-matrix.md"
