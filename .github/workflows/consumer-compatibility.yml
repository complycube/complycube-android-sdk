name: Android consumer compatibility

on:
  pull_request:
    paths:
      - 'compatibility/**'
      - '.github/workflows/consumer-compatibility.yml'
      - 'app/build.gradle'
      - 'app/src/main/**'
      - 'settings.gradle'
      - 'README.md'
      - 'docs/compatibility-matrix.md'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Exact published SDK version (empty uses matrix.json)'
        type: string
        default: ''
      trusted_scenario:
        description: 'Authenticated scenario (fresh fixture per run)'
        type: choice
        options: [C, D]
        default: C
      trusted_credentials:
        description: 'Run approved synthetic workflow tests using fresh environment credentials (default branch only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: consumer-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - run: python3 -m unittest discover -s compatibility/tests -v

  baseline:
    needs: diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        control: [false, true]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.8.0
        with:
          distribution: temurin
          java-version: '17.0.15+6'
      - name: Start disposable device
        run: |
          sudo chmod 666 /dev/kvm
          compatibility/tools/start-emulator.sh
      - name: Build and exercise documented baseline
        env:
          CONTROL: ${{ matrix.control }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          args=(A --device --out compatibility/out/result)
          if [[ "$CONTROL" == true ]]; then args+=(--control); fi
          if [[ -n "$SDK_VERSION" ]]; then args+=(--sdk-version "$SDK_VERSION"); fi
          set +e
          python3 compatibility/tools/run.py "${args[@]}"
          runner_status=$?
          set -e
          # Exit 2 means runtime coverage is blocked. The explicit gate still
          # requires resolution, intended versions, both builds and host assertions.
          if [[ "$runner_status" -ne 0 && "$runner_status" -ne 2 ]]; then exit "$runner_status"; fi
          python3 compatibility/tools/gate.py compatibility/out/result/result.json --runtime
      - name: Upload sanitized text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseline-control-${{ matrix.control }}
          path: compatibility/out/result/
          retention-days: 7
          if-no-files-found: warn

  exploratory:
    if: github.event_name == 'workflow_dispatch'
    needs: diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [B, C, D]
        control: [false, true]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.8.0
        with:
          distribution: temurin
          java-version: '17.0.15+6'
      - name: Start disposable device
        run: |
          sudo chmod 666 /dev/kvm
          compatibility/tools/start-emulator.sh
      - name: Run exploratory row (failures remain visible)
        env:
          SCENARIO: ${{ matrix.scenario }}
          CONTROL: ${{ matrix.control }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          args=("$SCENARIO" --device --out compatibility/out/result)
          if [[ "$CONTROL" == true ]]; then args+=(--control); fi
          if [[ -n "$SDK_VERSION" ]]; then args+=(--sdk-version "$SDK_VERSION"); fi
          set +e
          python3 compatibility/tools/run.py "${args[@]}"
          runner_status=$?
          set -e
          if [[ "$runner_status" -ne 0 && "$runner_status" -ne 2 ]]; then exit "$runner_status"; fi
          python3 compatibility/tools/gate.py compatibility/out/result/result.json --runtime
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exploratory-${{ matrix.scenario }}-control-${{ matrix.control }}
          path: compatibility/out/result/
          retention-days: 7

  trusted-sdk:
    # Never runs for PRs or non-default branches. Configure required environment
    # reviewers and a deployment branch restriction before enabling the secret.
    if: github.event_name == 'workflow_dispatch' && inputs.trusted_credentials && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: diagnostics
    environment: compatibility-trusted
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.8.0
        with:
          distribution: temurin
          java-version: '17.0.15+6'
      - name: Start disposable device
        run: |
          sudo chmod 666 /dev/kvm
          compatibility/tools/start-emulator.sh
      - name: Run trusted SDK round trips
        env:
          FIXTURE: ${{ secrets.COMPAT_CREDENTIAL_FIXTURE }}
          SCENARIO: ${{ inputs.trusted_scenario }}
          SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          umask 077
          fixture="$RUNNER_TEMP/credentials.json"
          trap 'rm -f "$fixture"' EXIT
          printf '%s' "$FIXTURE" > "$fixture"
          unset FIXTURE
          args=("$SCENARIO" --device --credentials "$fixture" --out compatibility/out/trusted)
          if [[ -n "$SDK_VERSION" ]]; then args+=(--sdk-version "$SDK_VERSION"); fi
          python3 compatibility/tools/run.py "${args[@]}"
      - name: Upload only sanitized summaries from credentialed execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-sdk-summary
          path: |
            compatibility/out/trusted/result.json
            compatibility/out/trusted/summary.md
          retention-days: 3
